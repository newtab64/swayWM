# Fern: font, borders, gaps, GTK settings, Wayland-only.
# Loaded after Fedora's /usr/share/sway/config.d/*.conf.
# Screen resolution and scale (all outputs): 1920x1200 at 1.2 gives a 1600x1000 desktop.
output * resolution 1920x1200 scale 1.2

font pango:JetBrainsMono Nerd Font Mono 14
default_border pixel 1
gaps inner 8

# class                 border  backgr. text    indicator child_border
client.focused          #f6deae #06121e #9bbbe0 #f6deae   #f6deae
client.focused_inactive #46607e #06121e #46607e #46607e   #46607e
client.unfocused        #46607e #06121e #46607e #46607e   #46607e
client.urgent           #9bbbe0 #06121e #9bbbe0 #9bbbe0   #9bbbe0

# GTK3 apps read the font and dark mode from GSettings first. Re-applied on every reload.
exec_always gsettings set org.gnome.desktop.interface font-name 'JetBrainsMono Nerd Font Mono 12'
exec_always gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

# Wayland only: no Xwayland, so X11-only apps will not start (no fallback).
xwayland disable
